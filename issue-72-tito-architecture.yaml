name: "Issue #72: TITO Architecture (Option 3 - Miles patched /v1/)"

layout:
  direction: top-to-bottom

blocks:
  # ── Layer 1: SGLang (patched inference server) ────────────────────
  - id: sglang-protocol
    url: https://github.com/sgl-project/sglang/blob/c09a160e6ccf642e62f4ff3129786c583b9caae1/python/sglang/srt/entrypoints/openai/protocol.py
    branch: sglang-miles-v0.5.9
    label: "protocol.py (token_id, input_token_ids patches)"

  - id: sglang-serving-chat
    url: https://github.com/sgl-project/sglang/blob/c09a160e6ccf642e62f4ff3129786c583b9caae1/python/sglang/srt/entrypoints/openai/serving_chat.py
    branch: sglang-miles-v0.5.9
    label: "serving_chat.py (patched /v1/chat/completions)"

  - id: sglang-patch
    url: https://github.com/radixark/miles/blob/47e6dfd7af652b291c253c71fb6a5ca09f17099a/docker/patch/latest/sglang.patch
    branch: main
    label: "sglang.patch (applied on top of fork branch)"

  # ── Layer 2: Miles (RL framework) ─────────────────────────────────
  - id: agentic-generate
    url: https://github.com/radixark/miles/blob/47e6dfd7af652b291c253c71fb6a5ca09f17099a/miles/rollout/generate_hub/agentic_tool_call.py#L40-L95
    branch: main
    label: "agentic_tool_call.generate()"

  - id: swe-agent-fn
    url: https://github.com/radixark/miles/blob/47e6dfd7af652b291c253c71fb6a5ca09f17099a/examples/experimental/swe-agent-v2/swe_agent_function.py#L24-L80
    branch: main
    label: "swe_agent_function.run() [reference pattern]"

  - id: oai-endpoint-utils
    url: https://github.com/radixark/miles/blob/cc758db65423ba8507e49a32a5691150ed79260a/miles/rollout/generate_utils/openai_endpoint_utils.py#L196-L208
    branch: main
    label: "_truncate_sample_output() [BUG: miles#861]"

  # ── Layer 3: Harbor + RL360 (agent + our integration) ─────────────
  - id: harbor-server
    url: https://github.com/radixark/miles/blob/47e6dfd7af652b291c253c71fb6a5ca09f17099a/examples/experimental/swe-agent-v2/server.py#L55-L208
    branch: main
    label: "Harbor server: _run_trial() via FastAPI"

  - id: rl360-generate
    url: https://github.com/LLM360/RL360/blob/eaedcf71a33aaaebba7600560e492001b5aeee55/src/agent360/harbor/miles/generate.py#L130-L328
    branch: async-tblite
    label: "RL360 generate_rollout_async()"

  - id: rl360-utils
    url: https://github.com/LLM360/RL360/blob/eaedcf71a33aaaebba7600560e492001b5aeee55/src/agent360/harbor/utils.py#L93-L157
    branch: async-tblite
    label: "RL360 build_tokens_and_mask()"

  # ── Fallback ──────────────────────────────────────────────────────
  - id: harbor-sglang-llm
    url: https://github.com/harbor-framework/harbor/blob/8dd9c4f6a2648716ae1ca395a9bc642525a6a59c/src/harbor/llms/sglang.py#L75-L163
    branch: feat/sglang-llm-backend
    label: "SglangLLM [fallback: harbor PR #1329]"

  - id: swe-reward
    url: https://github.com/radixark/miles/blob/47e6dfd7af652b291c253c71fb6a5ca09f17099a/examples/experimental/swe-agent-v2/generate.py#L30-L38
    branch: main
    label: "reward_func() reads sample.metadata"

  # ── Annotations ───────────────────────────────────────────────────
  - id: option3-note
    type: note
    content: "Option 3: Miles owns full TITO pipeline. SGLang fork branch + patch adds token_ids to /v1/. Harbor unaware of metadata."

  - id: bug-note
    type: note
    content: "BLOCKER for R3: _truncate_sample_output() skips rollout_routed_experts. Filed as miles#861."

  - id: sglang-risk-note
    type: note
    content: "HIGH RISK: locked to sglang-miles-v0.5.9. SGLang version bump requires rebasing patch against serving_chat.py, protocol.py, utils.py."

  - id: fallback-note
    type: note
    content: "Fallback: if fork patch breaks, harbor#1329 SglangLLM calls native /generate (all metadata, no patches). Option 2."

connections:
  - from: sglang-protocol
    to: sglang-serving-chat
    label: "defines patched request/response types"
  - from: sglang-patch
    to: sglang-protocol
    label: "applied on top of fork branch"
  - from: agentic-generate
    to: sglang-serving-chat
    label: "via Miles SessionServer proxy"
  - from: agentic-generate
    to: harbor-server
    label: "dispatches to Harbor /run"
  - from: agentic-generate
    to: oai-endpoint-utils
    label: "collect_records() then compute_samples()"
  - from: swe-agent-fn
    to: harbor-server
    label: "reference impl"
  - from: harbor-server
    to: swe-reward
    label: "returns {reward, trajectory}"
  - from: rl360-generate
    to: agentic-generate
    label: "migrating to"
  - from: rl360-generate
    to: rl360-utils
    label: "tokenization + loss mask"
  - from: oai-endpoint-utils
    to: bug-note
    label: "known bug"
  - from: harbor-sglang-llm
    to: fallback-note
    label: "fallback path"
  - from: sglang-protocol
    to: sglang-risk-note
    label: "fork maintenance risk"
  - from: agentic-generate
    to: option3-note
    label: "chosen approach"
